// ---------- PROGRESS ----------
const hasC=typeof Chart!='undefined';if(hasC){Chart.defaults.color='#8a9bb0';Chart.defaults.borderColor='#223041';Chart.defaults.aspectRatio=2}

(function(){if(!LOG.length){$('progBox').innerHTML='<p class="empty">No workouts logged yet. After your first session you\'ll see estimated 1RM per lift, weekly tonnage and PRs here.</p>';return}
 const e1=r=>r.w*(1+r.r/30),mains=Object.keys(EX).filter(n=>EX[n].main&&n!='RDL'&&LOG.some(r=>r.exercise==n&&r.w>0));

 mains.forEach((n,i)=>{const by={};LOG.filter(r=>r.exercise==n&&r.w>0).forEach(r=>by[r.date]=Math.max(by[r.date]||0,e1(r)));const ds=Object.keys(by).sort();

 new Chart($('ton'),{type:'bar',data:{labels:ws.map(w=>'wk '+w.slice(5)),datasets:[{data:ws.map(w=>Math.round(wk[w])),backgroundColor:'#29b6f6'}]},options:{plugins:{legend:{display:false}}}})})();

function dayType(d){const md=mdLabel(d),s=sched[d],k=kindOf(s&&s.gym);if(md=='MD'||md=='MD-1'||k=='A'||k=='B')return'high';if((k=='rest'||k=='recovery')&&!(s&&/^Yes/.test(s.team_training))&&!(s&&s.speed))return'low';return'base'}
(function(){const K=P.kcal||{base:2750,high:3000,low:2500},prot=P.protein_g||170,N=D.nutrition.map(n=>({...n,k:num(n.kcal)||0,p:num(n.protein_g)||0,c:num(n.carbs_g)||0,f:num(n.fat_g)||0}));

 h+=T.length?'<table style="margin-top:8px"><tr><th>Meal</th><th>kcal</th><th>P</th><th>C</th><th>F</th></tr>'+T.map(n=>`<tr><td>${n.meal}</td><td>${n.k}</td><td>${n.p}</td><td>${n.c}</td><td>${n.f}</td></tr>`).join('')+'</table>':'<p class="empty">Nothing logged today — tell me or send a photo of what you eat.</p>';
 h+=`<p class="sub">Targets: ${K.low} rest · ${K.base} training · ${K.high} match/MD-1/gym · protein ${prot} g/day</p><canvas id="nut"></canvas>`;$('nutBox').innerHTML=h+(hasC?'':noChart);
 if(!hasC)return;const days=[...Array(7)].map((_,i)=>addD(TODAY,i-6)),s=(d,k)=>N.filter(n=>n.date==d).reduce((a,b)=>a+b[k],0);
 new Chart($('nut'),{data:{labels:days.map(d=>d.slice(5)),datasets:[{type:'bar',label:'kcal',data:days.map(d=>s(d,'k')),backgroundColor:'#ffb30099',yAxisID:'y'},{type:'line',label:'kcal target',data:days.map(d=>K[dayType(d)]),borderColor:'#ffb300',borderDash:[4,4],pointRadius:0,yAxisID:'y'},{type:'line',label:'protein g',data:days.map(d=>s(d,'p')),borderColor:'#00e676',yAxisID:'y1'}]},options:{scales:{y:{beginAtZero:true},y1:{position:'right',beginAtZero:true,grid:{display:false}}}}})})();
// ---------- WEIGHT ----------
(function(){const W=D.checkins.map(c=>({d:c.date,w:num(c.bodyweight_kg)})).filter(c=>c.w!=null).sort((a,b)=>a.d<b.d?-1:1);
 const sw=P.start_weight_kg||(W[0]&&W[0].w),sd=P.start_date||(W[0]&&W[0].d),[gf,gs]=P.goal_rate_kg_week||[-.5,-.3];
 if(!W.length){$('wBox').innerHTML='<p class="empty">No bodyweight logged.</p>';return}
 const avg7=d=>{const v=W.filter(x=>x.d<=d&&diff(d,x.d)<7).map(x=>x.w);return v.reduce((a,b)=>a+b)/v.length};
 const last=W[W.length-1],ra=avg7(last.d),wks=diff(last.d,sd)/7,first=W.filter(x=>diff(x.d,W[0].d)<7);
 let rate=null;if(diff(last.d,W[0].d)>=10){rate=(ra-avg7(addD(W[0].d,6)))/(diff(last.d,addD(W[0].d,6))/7)}
 let h=`<div class="row"><div class="kpi"><span class="sub">Latest</span><b>${last.w} kg</b><span class="sub">${last.d}</span></div><div class="kpi"><span class="sub">7-day avg</span><b>${ra.toFixed(1)} kg</b><span class="sub">start ${sw} kg · ${sd}</span></div><div class="kpi"><span class="sub">Rate</span><b>${rate==null?'—':(rate>0?'+':'')+rate.toFixed(2)+' kg/wk'}</b><span class="sub">goal ${gf} to ${gs} kg/wk</span></div></div>`;
 if(rate!=null)h+=`<p>${rate<gf-.2?'⚠ Losing too fast — risk to muscle & speed. Add ~200 kcal.':rate>gs+.15?'Slower than goal — trim ~150 kcal on rest days.':'✅ On track.'}</p>`;else h+='<p class="sub">Need ~10+ days of weigh-ins for a reliable rate. Weigh daily, morning, after toilet.</p>';

(function(){const DS={'full':'Full','moderate-legs':'Mod','light-legs':'Light','upper-only':'Upper','half':'Half'};const C={A:['FB A','#00e676','#002b14'],B:['FB B','#29b6f6','#00243a'],'A-lite':['A-lite','#8bc34a','#132400'],match:['GAME','#ff5252','#fff'],recovery:['Recov','#7e57c2','#fff'],rest:['Rest','#223041','#8a9bb0']};
 const SC={SA:['⚡A','#ff9100','#2b1500'],SB:['⚡B','#ffd740','#2b2200'],ST:['⚡T','#f48fb1','#3a0018']};
 let h='<div class="cal">';['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].forEach(x=>h+=`<div class="sub" style="text-align:center">${x}</div>`);
 const off=(pd(TODAY).getDay()+6)%7;for(let i=0;i<off;i++)h+='<div></div>';
 for(let i=0;i<14;i++){const d=addD(TODAY,i),s=sched[d],k=s?kindOf(s.gym):null,f=fixtures.find(x=>x.date==d),md=mdLabel(d),c=k&&C[k],dtp=dayType(d),sp=spOf(s),sc=sp&&SC[sp];
  const spTag=sc?`<span class="tag" style="background:${sc[1]};color:${sc[2]}">${s.speed_split?'AM ':''}${sc[0]}${sp!='ST'&&s.speed_dose=='half'?' ½':''}</span>`:'';
  h+=`<div class="day ${d==TODAY?'today':''} ${f?'match':''}"><b>${pd(d).getDate()}${pd(d).getDate()==1?'.'+(pd(d).getMonth()+1)+'.':''}</b><span class="sub" style="display:block">${md||'&nbsp;'}</span>${c?`${s.speed_split?spTag:''}<span class="tag" style="background:${c[1]};color:${c[2]}">${s.speed_split?'PM ':''}${c[0]}</span>${s.dose?`<span class="tag" style="background:transparent;border:1px solid ${DCOL[s.dose]};color:${DCOL[s.dose]}">${DS[s.dose]}</span>`:''}${s.speed_split?'':spTag}`:'<span class="tag" style="background:#222">not planned</span>'}${f?`<span style="display:block;margin-top:3px">${f.kickoff} ${f.venue=='home'?'H':'A'}</span>`:''}${s&&/^Yes/.test(s.team_training)?'<span class="sub" style="display:block">+TT</span>':''}<span class="sub" style="display:block">${(P.kcal||{})[dtp]||''}</span></div>`}
 const wk={};Object.entries(sched).forEach(([d,s])=>{if(s.speed&&d>=addD(TODAY,-((pd(TODAY).getDay()+6)%7))){const m=addD(d,-((pd(d).getDay()+6)%7));wk[m]=(wk[m]||0)+1}});
